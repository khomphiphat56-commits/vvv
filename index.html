<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>1 Month Anniversary 💜</title>

<style>
:root{
  --bg1:#f6f1ff;
  --bg2:#e6dcff;
  --bg3:#d4c4ff;
  --accent:#9b7cff;
  --deep:#5f4b8b;
  --soft:#7b6fa3;
}

*{
  box-sizing:border-box;
  font-family:"Segoe UI",system-ui,sans-serif;
}

body{
  margin:0;
  min-height:100vh;
  background:linear-gradient(135deg,var(--bg1),var(--bg2),var(--bg3));
  overflow:hidden;
}

/* เอฟเฟกพื้นหลัง */
.glow{
  position:fixed;
  width:420px;
  height:420px;
  background:radial-gradient(circle,rgba(200,170,255,.45),transparent 70%);
  filter:blur(60px);
  animation:floatGlow 18s infinite alternate ease-in-out;
}

.glow.g1{top:-120px;left:-120px}
.glow.g2{bottom:-150px;right:-150px;animation-delay:6s}

@keyframes floatGlow{
  from{transform:translateY(0)}
  to{transform:translateY(120px)}
}

/* ลอย */
.bg{
  position:fixed;
  inset:0;
  pointer-events:none;
  z-index:1;
}

.float-heart,.float-img{
  position:absolute;
  bottom:-80px;
  opacity:.7;
  animation:rise linear forwards;
}

.float-img{
  width:42px;
  height:42px;
  border-radius:50%;
  object-fit:cover;
  box-shadow:0 8px 18px rgba(140,100,200,.35);
}

@keyframes rise{
  from{
    transform:translateY(0) translateX(0) scale(.9);
    opacity:0;
  }
  10%{opacity:.7}
  to{
    transform:translateY(-130vh) translateX(60px) scale(1.1);
    opacity:0;
  }
}

/* หน้าเนื้อหา */
.main{
  position:relative;
  z-index:10;
  min-height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  padding:24px;
}

.card{
  width:100%;
  max-width:480px;
  background:rgba(255,255,255,.75);
  backdrop-filter:blur(16px);
  border-radius:32px;
  padding:42px 30px;
  text-align:center;
  box-shadow:0 35px 70px rgba(140,110,200,.3);
  animation:cardIn 1.2s ease forwards;
}

@keyframes cardIn{
  from{opacity:0;transform:translateY(40px) scale(.95)}
  to{opacity:1;transform:none}
}

.photo-wrap{
  position:relative;
  width:180px;
  height:180px;
  margin:0 auto 18px;
}

.photo-wrap::before{
  content:"";
  position:absolute;
  inset:-12px;
  border-radius:50%;
  background:conic-gradient(#c9b3ff,#a88bff,#c9b3ff);
  filter:blur(8px);
  animation:spin 10s linear infinite;
}

@keyframes spin{
  from{transform:rotate(0)}
  to{transform:rotate(360deg)}
}

.photo{
  position:relative;
  width:100%;
  height:100%;
  border-radius:50%;
  overflow:hidden;
  border:6px solid rgba(255,255,255,.9);
  box-shadow:0 18px 40px rgba(140,110,200,.45);
  background:#fff;
}

.photo img{
  width:100%;
  height:100%;
  object-fit:cover;
}

h1{
  margin:18px 0 4px;
  font-size:28px;
  color:var(--deep);
}

.sub{
  font-size:15px;
  color:var(--soft);
}

.badge{
  display:inline-block;
  margin-top:10px;
  padding:6px 16px;
  border-radius:20px;
  background:linear-gradient(135deg,#b79cff,#9a7dff);
  color:#fff;
  font-size:13px;
  box-shadow:0 8px 20px rgba(140,110,200,.4);
}

.divider{
  margin:26px auto;
  width:90px;
  height:2px;
  background:linear-gradient(90deg,transparent,var(--accent),transparent);
  position:relative;
}

.divider::after{
  content:"💜";
  position:absolute;
  top:-14px;
  left:50%;
  transform:translateX(-50%);
}

.msg{
  font-size:15px;
  line-height:1.9;
  color:#6a5f8f;
}
</style>
</head>

<body>

<div class="glow g1"></div>
<div class="glow g2"></div>

<div class="bg" id="bg"></div>

<div class="main">
  <div class="card">

    <div class="photo-wrap">
      <div class="photo">
        <img src="main.jpg">
      </div>
    </div>

    <h1>Happy Anniversary</h1>
    <div class="sub">ครบรอบของเรา</div>
    <div class="badge">💜 1 Month 💜</div>

    <div class="divider"></div>

    <div class="msg">
      (แก้ข้อความตรงนี้ได้)<br><br>
      หนึ่งเดือนที่ผ่านมามีความหมายมาก  
      ขอบคุณทุกความรู้สึก ทุกช่วงเวลา  
      และอยากมีคุณอยู่แบบนี้ไปเรื่อย ๆ
    </div>

  </div>
</div>

<script>
const bg=document.getElementById("bg");
const hearts=["💜","💖","💗","🤍","✨","🌸","💞","💫"];
const imgs=["pic1.jpg","pic2.jpg"];

function spawn(){
  const isImg=Math.random()>0.4;

  if(isImg){
    const img=document.createElement("img");
    img.src=imgs[Math.floor(Math.random()*imgs.length)];
    img.className="float-img";
    img.style.left=Math.random()*100+"vw";
    img.style.animationDuration=(7+Math.random()*6)+"s";
    bg.appendChild(img);
    setTimeout(()=>img.remove(),16000);
  }else{
    const h=document.createElement("div");
    h.className="float-heart";
    h.textContent=hearts[Math.floor(Math.random()*hearts.length)];
    h.style.left=Math.random()*100+"vw";
    h.style.fontSize=(14+Math.random()*22)+"px";
    h.style.animationDuration=(6+Math.random()*6)+"s";
    bg.appendChild(h);
    setTimeout(()=>h.remove(),16000);
  }
}

/* เพิ่มความหนาแน่น */
setInterval(spawn,180);
</script>

</body>
</html>
